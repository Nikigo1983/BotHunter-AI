<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotHunter Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .score-card { min-width: 120px; }
        .explanation-section { border-top: 1px solid var(--bs-border-color); padding-top: 1rem; margin-top: 1rem; }
        .explanation-section:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
        .explanation-section-title { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--bs-secondary-color); margin-bottom: 0.5rem; }
        .rule-item { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; }
        .rule-item .check { color: var(--bs-success); margin-right: 0.35rem; }
        .feature-json { background: var(--bs-tertiary-bg); border-radius: 0.375rem; padding: 0.75rem; overflow-x: auto; }
        .explain-hero { background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%); border-radius: 0.5rem; padding: 1.25rem; }
        .explain-summary { font-size: 1.05rem; font-weight: 600; color: #1f2937; }
        .confidence-track { height: 0.5rem; border-radius: 999px; background: #e9ecef; overflow: hidden; }
        .confidence-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
        .signal-chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.65rem; border-radius: 999px; font-size: 0.8125rem; margin: 0.15rem; }
        .signal-positive { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .signal-negative { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .why-block { background: #fff; border: 1px solid var(--bs-border-color); border-left: 4px solid var(--bs-primary); border-radius: 0.375rem; padding: 1rem; }
        .risk-scale-track { height: 0.5rem; border-radius: 999px; background: linear-gradient(to right, #198754 0%, #198754 29%, #ffc107 30%, #ffc107 69%, #dc3545 70%, #dc3545 100%); overflow: hidden; position: relative; }
        .risk-scale-marker { position: absolute; top: -3px; width: 4px; height: calc(100% + 6px); background: #212529; border-radius: 2px; transform: translateX(-50%); }
        .risk-scale-legend { font-size: 0.75rem; color: var(--bs-secondary-color); }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">BotHunter Admin</a>
        <div class="navbar-nav">
            <a class="nav-link text-white-50" href="/admin">Join Requests</a>
            <a class="nav-link text-white-50" href="/admin/investigations">Investigations</a>
            <a class="nav-link text-white-50" href="/admin/channels">Channels</a>
            <a class="nav-link text-white-50" href="/admin/analytics">Analytics</a>
            <a class="nav-link text-white-50" href="/admin/ai">AI Usage</a>
            <a class="nav-link text-white-50" href="/admin/settings/ai">AI Settings</a>
        </div>
    </div>
</nav>
<main class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
