<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invite — BotHunter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-2">Join {{ organization.display_name or organization.name }}</h1>
                    <p class="text-muted small mb-4">Invite for {{ invite.email }} · role {{ invite.role }}</p>
                    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
                    <form method="post" action="/invite/{{ invite.token }}">
                        <div class="mb-3">
                            <label class="form-label">Full name</label>
                            <input type="text" name="full_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" minlength="8" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create account &amp; join</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
